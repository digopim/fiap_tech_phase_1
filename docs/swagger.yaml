openapi: 3.1.0
info:
  title: Oficina API - FIAP
  description: Phase 1 - API de gestão da oficina com autenticação JWT.
  version: 1.0.0
servers:
- url: http://localhost:8080/oficina/v1
  description: Generated server url
paths:
  /veiculo/{id}:
    get:
      tags:
      - veiculo-controller
      operationId: buscarPorId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VeiculoResponse"
    put:
      tags:
      - veiculo-controller
      operationId: atualizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VeiculoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VeiculoResponse"
    delete:
      tags:
      - veiculo-controller
      operationId: deletar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /servico/{id}:
    get:
      tags:
      - servico-controller
      operationId: buscarPorId_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServicoResponse"
    put:
      tags:
      - servico-controller
      operationId: atualizar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServicoResponse"
    delete:
      tags:
      - servico-controller
      operationId: deletar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /material/{id}:
    get:
      tags:
      - material-controller
      operationId: buscarPorId_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MaterialResponse"
    put:
      tags:
      - material-controller
      operationId: atualizar_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MaterialResponse"
    delete:
      tags:
      - material-controller
      operationId: deletar_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /veiculo:
    get:
      tags:
      - veiculo-controller
      operationId: listar
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VeiculoResponse"
    post:
      tags:
      - veiculo-controller
      operationId: criar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VeiculoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VeiculoResponse"
  /usuario/atualizar/{id}:
    post:
      tags:
      - usuario-controller
      operationId: atualizar_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
  /servico:
    get:
      tags:
      - servico-controller
      operationId: listar_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicoResponse"
    post:
      tags:
      - servico-controller
      operationId: criar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServicoResponse"
  /servico/concluir:
    post:
      tags:
      - servico-controller
      operationId: concluirServico
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemServicoRequest"
        required: true
      responses:
        "200":
          description: OK
  /ordem:
    get:
      tags:
      - ordem-controller
      operationId: obterOrdens
      parameters:
      - name: placa
        in: query
        required: false
        schema:
          type: string
      - name: cpfCNPJ
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrdemResponse"
    post:
      tags:
      - ordem-controller
      operationId: criar_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrdemRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrdemResponse"
  /ordem/{ordemId}/pagar:
    post:
      tags:
      - ordem-controller
      operationId: registrarPagamento
      parameters:
      - name: ordemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrdemResponse"
  /ordem/{ordemId}/orcamento:
    post:
      tags:
      - ordem-controller
      operationId: incluirOrcamento
      parameters:
      - name: ordemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrcamentoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrdemResponse"
  /ordem/{ordemId}/cancelar:
    post:
      tags:
      - ordem-controller
      operationId: cancelarOrdem
      parameters:
      - name: ordemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrdemResponse"
  /ordem/retirada:
    post:
      tags:
      - ordem-controller
      operationId: efetuarRetirada
      parameters:
      - name: placa
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrdemResponse"
  /ordem/concluir:
    post:
      tags:
      - ordem-controller
      operationId: concluirOrcamento
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConclusaoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrdemResponse"
  /ordem/aprovar:
    post:
      tags:
      - ordem-controller
      operationId: aprovarOrcamento
      parameters:
      - name: cpfCNPJ
        in: query
        required: true
        schema:
          type: string
      - name: placa
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AprovacaoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrdemResponse"
  /material:
    get:
      tags:
      - material-controller
      operationId: listar_2
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialResponse"
    post:
      tags:
      - material-controller
      operationId: criar_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MaterialResponse"
  /auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      parameters:
      - name: login
        in: header
        required: true
        schema:
          type: string
      - name: senha
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /veiculo/placa/{placa}:
    get:
      tags:
      - veiculo-controller
      operationId: buscarPorPlaca
      parameters:
      - name: placa
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VeiculoResponse"
  /usuario:
    get:
      tags:
      - usuario-controller
      operationId: listar_3
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioResponse"
  /usuario/{id}:
    get:
      tags:
      - usuario-controller
      operationId: buscarPorId_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
    delete:
      tags:
      - usuario-controller
      operationId: deletar_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /usuario/cpf/{cpf}:
    get:
      tags:
      - usuario-controller
      operationId: buscarPorCpf
      parameters:
      - name: cpf
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
  /servico/aberto:
    get:
      tags:
      - servico-controller
      operationId: listarEmAberto
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemServicoResponse"
  /ordem/status:
    get:
      tags:
      - ordem-controller
      operationId: obterOrdensPorStatus
      parameters:
      - name: status
        in: query
        required: true
        schema:
          type: string
          enum:
          - RECEBIDA
          - EM_DIAGNOSTICO
          - AGUARDANDO_APROVACAO
          - EM_EXECUCAO
          - FINALIZADA
          - LIBERADA
          - ENTREGUE
          - CANCELADA
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrdemResponse"
  /admin/panorama:
    get:
      tags:
      - admin-controller
      operationId: obterPanorama
      parameters:
      - name: inicio
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: fim
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Panorama"
  /admin/ordens/placa:
    get:
      tags:
      - admin-controller
      operationId: obterOrdensPorPlaca
      parameters:
      - name: placa
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrdemResponse"
  /admin/ordens/cpfcnpj:
    get:
      tags:
      - admin-controller
      operationId: obterOrdensPorCpfCNPJ
      parameters:
      - name: cpfCNPJ
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrdemResponse"
  /admin/estoque:
    get:
      tags:
      - admin-controller
      operationId: listarEstoqueAtual
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EstoqueResponse"
components:
  schemas:
    VeiculoRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        placa:
          type: string
        montadora:
          type: string
        modelo:
          type: string
        cor:
          type: string
        tipo:
          type: string
        chassi:
          type: string
        anoFabricacao:
          type: integer
          format: int32
        quilometragem:
          type: integer
          format: int32
    VeiculoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        placa:
          type: string
        montadora:
          type: string
        modelo:
          type: string
        cor:
          type: string
        tipo:
          type: string
        chassi:
          type: string
        anoFabricacao:
          type: integer
          format: int32
        quilometragem:
          type: integer
          format: int32
    ServicoRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        descricao:
          type: string
        custo:
          type: number
        valor:
          type: number
        duracao:
          type: integer
          format: int32
    ServicoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        descricao:
          type: string
        custo:
          type: number
        valor:
          type: number
        duracao:
          type: integer
          format: int32
    MaterialRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        descricao:
          type: string
        valor:
          type: number
        custo:
          type: number
        tipo:
          type: string
    MaterialResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        descricao:
          type: string
        valor:
          type: number
        custo:
          type: number
        tipo:
          type: string
    UsuarioRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        sobrenome:
          type: string
        email:
          type: string
        cpfCNPJ:
          type: string
        telefone:
          type: string
        perfil:
          type: string
    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        sobrenome:
          type: string
        email:
          type: string
        cpfCNPJ:
          type: string
        telefone:
          type: string
        perfil:
          type: string
    ItemServicoRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        executor:
          type: integer
          format: int64
    Formulario:
      type: object
      properties:
        respostas:
          type: object
          additionalProperties:
            type: boolean
    OrdemRequest:
      type: object
      properties:
        veiculo:
          $ref: "#/components/schemas/VeiculoRequest"
        responsavel:
          type: integer
          format: int64
        cliente:
          $ref: "#/components/schemas/UsuarioRequest"
        formulario:
          $ref: "#/components/schemas/Formulario"
    OrcamentoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dataCriacao:
          type: string
          format: date-time
        dataAprovacao:
          type: string
          format: date-time
        dataConclusao:
          type: string
          format: date-time
        valor:
          type: number
        estimativa:
          type: string
        servicos:
          type: object
          additionalProperties:
            type: number
        materiais:
          type: object
          additionalProperties:
            type: number
        status:
          type: string
    OrdemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
        observacoes:
          type: string
        dataCriacao:
          type: string
          format: date-time
        dataInicio:
          type: string
          format: date-time
        dataConclusao:
          type: string
          format: date-time
        dataPagamento:
          type: string
          format: date-time
        valorTotal:
          type: number
        tempoExecucao:
          type: string
        responsavel:
          type: string
        cliente:
          type: string
        orcamentos:
          type: array
          items:
            $ref: "#/components/schemas/OrcamentoResponse"
    OrcamentoRequest:
      type: object
      properties:
        orcamentoId:
          type: integer
          format: int64
        servicos:
          type: object
          additionalProperties:
            type: integer
            format: int32
        materiais:
          type: object
          additionalProperties:
            type: integer
            format: int32
        concluirDiagnostico:
          type: boolean
    ConclusaoRequest:
      type: object
      properties:
        ordem:
          type: integer
          format: int64
        orcamento:
          type: integer
          format: int64
    AprovacaoRequest:
      type: object
      properties:
        aprovado:
          type: boolean
    TokenResponse:
      type: object
      properties:
        token:
          type: string
    ItemServicoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orcamento:
          type: integer
          format: int64
        ordem:
          type: integer
          format: int64
        servicoId:
          type: integer
          format: int64
        servico:
          type: string
        quantidade:
          type: integer
          format: int32
    CaixaResponse:
      type: object
      properties:
        descricao:
          type: string
        valor:
          type: number
    Panorama:
      type: object
      properties:
        custos:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/CaixaResponse"
        receitas:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/CaixaResponse"
        orcamentos:
          $ref: "#/components/schemas/PanoramaOrcamento"
        totalCustos:
          type: number
        totalReceitas:
          type: number
        saldo:
          type: number
    PanoramaOrcamento:
      type: object
      properties:
        aprovados:
          type: integer
          format: int32
        rejeitados:
          type: integer
          format: int32
        abertos:
          type: integer
          format: int32
    EstoqueResponse:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string
        preco:
          type: number
        quantidade:
          type: integer
          format: int32
        tipo:
          type: string
          enum:
          - PECA
          - MATERIAL
          - FERRAMENTA
          - ALIMENTO
